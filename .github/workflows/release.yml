name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version
        run: test "$(cat version)" = "${GITHUB_REF_NAME#v}"
      - name: Run tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest
          python -m ruff check .
          python -m mypy
      - name: Build reproducible package
        run: |
          archive="dbus-wengao-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar --prefix="dbus-wengao-${GITHUB_REF_NAME}/" HEAD | gzip -n > "$archive"
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dbus-wengao-*.tar.gz dbus-wengao-*.sha256

