name: test

on:
  push:
    branches: [main, beta, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest --cov=wengao --cov-report=term-missing

  shell-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: >-
          shellcheck enable.sh disable.sh restart.sh uninstall.sh install.sh setup
          service/run service/log/run
          contrib/venus-time-sync/enable.sh contrib/venus-time-sync/disable.sh
          contrib/venus-time-sync/service/run contrib/venus-time-sync/service/log/run
      - name: Reject private and generated files
        run: |
          test -z "$(git ls-files | grep -E '(^|/)(reference-private|config\.toml|captures)(/|$)' || true)"
          test -z "$(git grep -nE '([[:xdigit:]]{2}:){5}[[:xdigit:]]{2}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|192\.168\.' || true)"
