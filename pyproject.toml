[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbus-wengao"
version = "0.1.0.dev0"
description = "Clean-room Venus OS driver for Wengao WG-48BC1500M DC/DC converters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "dbus-wengao contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.5",
  "types-pyserial>=3.5.0.20240527",
]

[project.scripts]
dbus-wengao-read = "wengao.cli:main"
dbus-wengao-service = "wengao.venus.runner:main"
dbus-wengao-services = "wengao.servicegen:main"

[project.urls]
Homepage = "https://github.com/Tomblarom/dbus-wengao"
Repository = "https://github.com/Tomblarom/dbus-wengao.git"
Issues = "https://github.com/Tomblarom/dbus-wengao/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/wengao/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wengao"]
exclude = "src/wengao/_vendor/"

[tool.coverage.run]
omit = ["src/wengao/_vendor/*"]
