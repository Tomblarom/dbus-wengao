config_version = 1

[[devices]]
id = "example-device"
enabled = false
profile = "bidirectional-battery-link"
port = "/dev/serial/by-id/REPLACE_ME"
slave_address = 1
system_terminal = "B"
device_instance = 40
custom_name = "Wengao DC-DC"
venus_role = "dcsystem"
control_mode = "monitor-only"
dvcc_policy = "disabled"
communication_timeout = 1.0
poll_interval = 2.0
allowed_directions = ["A-to-B", "B-to-A"]
locked_direction = ""

[devices.permissions]
remote_on_off = false
set_voltage = false
set_current = false
set_direction = false
set_mode = false
set_protection_limits = false
calibration = false
factory_reset = false

# Keep this enabled when loss of an expected converter should raise a Venus alarm.
# Disable it only for intentionally optional/intermittent devices. /Connected remains accurate.
# [devices.alarms]
# communication = true

# Required only when the corresponding voltage/current permission is enabled.
# Limits are per destination terminal and may only narrow the hardware limits.
# [devices.write_limits]
# minimum_interval = 5.0
# terminal_a_voltage = [12.0, 14.6]
# terminal_a_current = [1.0, 100.0]
# terminal_b_voltage = [48.0, 58.4]
# terminal_b_current = [1.0, 25.0]

[devices.auxiliary_battery]
enabled = false
terminal = "A"
device_instance = 80
custom_name = "Auxiliary battery"

[display]
unavailable_devices = "hide"

[debug]
raw_capture = false
capture_directory = "/var/log/dbus-wengao/capture"
